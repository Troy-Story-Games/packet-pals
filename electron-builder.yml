appId: com.troystorygames.packetpals
productName: Packet Pals
artifactName: packet-pals-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - build/icon.png
  - package.json
  # The renderer is fully bundled by Vite, so no runtime node_modules are needed.
  - '!**/node_modules/**'
win:
  target:
    - nsis
    - portable
portable:
  artifactName: packet-pals-${version}-windows-portable.${ext}
nsis:
  artifactName: packet-pals-${version}-windows-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.education
linux:
  target: AppImage
  category: Education
publish:
  provider: github
  releaseType: draft
